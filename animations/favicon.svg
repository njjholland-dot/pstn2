    <line x1="14" y1="44" x2="32" y2="52"/>
    <line x1="50" y1="44" x2="32" y2="52"/>
    <line x1="18" y1="20" x2="50" y2="44"/>
    <line x1="46" y1="20" x2="14" y2="44"/>
  </g>
  <g fill="#ffffff">
    <circle cx="18" cy="20" r="7"/>
    <circle cx="46" cy="20" r="7"/>
    <circle cx="14" cy="44" r="7"/>
    <circle cx="50" cy="44" r="7"/>
    <circle cx="32" cy="52" r="7"/>
